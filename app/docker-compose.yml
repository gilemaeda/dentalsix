services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dentalsix
      POSTGRES_USER: dentalsix
      POSTGRES_PASSWORD: DentalSix2026Homol
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentalsix -d dentalsix"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:3000"
    environment:
      DATABASE_URL: postgresql://dentalsix:DentalSix2026Homol@db:5432/dentalsix
      JWT_SECRET: dentalsix-jwt-secret-homol-2026
      NEXTAUTH_SECRET: dentalsix-nextauth-secret-homol-2026
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
